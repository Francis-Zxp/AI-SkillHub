name: AI SkillHub CI

# Minimum gate before merging AI SkillHub changes: Rust tests, TypeScript types, frontend build.
# Does NOT run the signed NSIS build here — the private updater key stays on the
# release workstation and formal assets are published only after this CI passes.

on:
  push:
    branches: [main]
    paths:
      - "app-next/**"
      - "updates/**"
      - "docs/release-notes/**"
      - "CHANGELOG.md"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app-next/**"
      - "updates/**"
      - "docs/release-notes/**"
      - "CHANGELOG.md"
      - ".github/workflows/v2-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: app-next

# GitHub-hosted runners support Node 24.  Keep third-party JavaScript actions
# on that runtime too, so their Node 20 deprecation notices do not obscure
# actual CI failures.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-tests:
    name: cargo test (Rust backend)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-next/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app-next/src-tauri/Cargo.lock') }}

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --tests

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: MCP read-only integration contract
        run: cargo test --manifest-path src-tauri/Cargo.toml --test mcp_center_read_only

      - name: MCP mutation transaction contract
        run: cargo test --manifest-path src-tauri/Cargo.toml --test mcp_mutation

      - name: Codex doctor read-only integration contract
        run: cargo test --manifest-path src-tauri/Cargo.toml --test codex_plugin_doctor_read_only

      - name: PowerShell 5.1/7 sync resilience contracts
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-sync-runtime-resilience.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-diagnostics-index-integrity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-parent-router-powershell.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-codex-skill-delivery.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Real Imbad0202 codeload recipient gate
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib tests::github_codeload_imports_real_academic_research_skills_codex_without_security_noise -- --ignored --exact

  frontend:
    name: tsc + vite build (React frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.2.2"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store/v3
          key: ${{ runner.os }}-pnpm-${{ hashFiles('app-next/pnpm-lock.yaml') }}

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit -p .

      - name: Frontend behavior contracts
        run: node --test ./scripts/*.test.mjs

      - name: Vite production build
        run: pnpm exec vite build

      - name: Frontend bundle budget
        run: node ./scripts/check-bundle-budget.mjs
